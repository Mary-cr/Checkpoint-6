<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="260" fill="#ffffff"/>

  <rect x="10" y="90" width="150" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="85" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">Usuario(</text>
  <text x="85" y="134" text-anchor="middle" font-size="11" fill="#312e81">"Cecilia_Ramos",</text>
  <text x="85" y="148" text-anchor="middle" font-size="11" fill="#312e81">"55123MC")</text>

  <line x1="160" y1="125" x2="205" y2="125" stroke="#6b7280" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="205" y="90" width="150" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">Python crea</text>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#065f46">un objeto</text>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#065f46">(vacío todavía)</text>

  <line x1="355" y1="125" x2="400" y2="125" stroke="#6b7280" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="400" y="90" width="170" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="485" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">se llama</text>
  <text x="485" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">__init__() automático</text>
  <text x="485" y="146" text-anchor="middle" font-size="11" fill="#92400e">self = ese objeto</text>

  <line x1="570" y1="125" x2="615" y2="125" stroke="#6b7280" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="615" y="70" width="140" height="110" rx="8" fill="#fde2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="685" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">se asignan</text>
  <text x="685" y="110" text-anchor="middle" font-size="11" fill="#7f1d1d">self.nombre_de_usuario</text>
  <text x="685" y="124" text-anchor="middle" font-size="11" fill="#7f1d1d">= "Cecilia_Ramos"</text>
  <text x="685" y="142" text-anchor="middle" font-size="11" fill="#7f1d1d">self.contraseña</text>
  <text x="685" y="156" text-anchor="middle" font-size="11" fill="#7f1d1d">= "55123MC"</text>

  <text x="380" y="230" text-anchor="middle" font-size="13" fill="#374151" font-style="italic">resultado: usuario1 queda listo, con sus atributos ya cargados</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
