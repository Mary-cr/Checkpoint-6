<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="220" fill="#ffffff"/>

  <rect x="20" y="70" width="140" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="90" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">Cliente</text>
  <text x="90" y="126" text-anchor="middle" font-size="10" fill="#312e81">(app / navegador)</text>

  <rect x="310" y="70" width="140" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">API</text>
  <text x="380" y="126" text-anchor="middle" font-size="10" fill="#92400e">(el puente)</text>

  <rect x="600" y="70" width="140" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="670" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">Servidor</text>
  <text x="670" y="126" text-anchor="middle" font-size="10" fill="#065f46">(sistema externo)</text>

  <line x1="160" y1="95" x2="310" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#a4)"/>
  <text x="235" y="85" text-anchor="middle" font-size="11" fill="#374151">1. solicitud</text>

  <line x1="450" y1="95" x2="600" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#a4)"/>
  <text x="525" y="85" text-anchor="middle" font-size="11" fill="#374151">2. reenvía</text>

  <line x1="600" y1="118" x2="450" y2="118" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a4)"/>
  <text x="525" y="135" text-anchor="middle" font-size="11" fill="#6b7280">3. respuesta</text>

  <line x1="310" y1="140" x2="160" y2="140" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a4)"/>
  <text x="235" y="157" text-anchor="middle" font-size="11" fill="#6b7280">4. entrega datos</text>

  <text x="380" y="195" text-anchor="middle" font-size="12" fill="#4b5563" font-style="italic">para el usuario, todo esto se ve como una sola conexión sin fisuras</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
