<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="320" fill="#ffffff"/>

  <rect x="30" y="30" width="140" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="100" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">Cliente</text>

  <rect x="530" y="30" width="140" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="600" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">Servidor</text>

  <!-- GET -->
  <line x1="170" y1="110" x2="530" y2="110" stroke="#2563eb" stroke-width="2" marker-end="url(#a3)"/>
  <text x="350" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">GET /usuarios</text>
  <line x1="530" y1="130" x2="170" y2="130" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a3b)"/>
  <text x="350" y="148" text-anchor="middle" font-size="11" fill="#2563eb">respuesta: lista de usuarios (sin cambios en el servidor)</text>

  <!-- POST -->
  <line x1="170" y1="185" x2="530" y2="185" stroke="#059669" stroke-width="2" marker-end="url(#a3)"/>
  <text x="350" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">POST /usuarios (con datos)</text>
  <line x1="530" y1="205" x2="170" y2="205" stroke="#059669" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a3b)"/>
  <text x="350" y="223" text-anchor="middle" font-size="11" fill="#059669">respuesta: usuario creado (nuevo recurso)</text>

  <!-- PUT -->
  <line x1="170" y1="260" x2="530" y2="260" stroke="#d97706" stroke-width="2" marker-end="url(#a3)"/>
  <text x="350" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">PUT /usuarios/3 (todos los datos)</text>
  <line x1="530" y1="280" x2="170" y2="280" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a3b)"/>
  <text x="350" y="298" text-anchor="middle" font-size="11" fill="#d97706">respuesta: usuario actualizado (reemplazo completo)</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="a3b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
