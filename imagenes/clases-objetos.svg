<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <!-- Clase (plano) -->
  <rect x="30" y="90" width="200" height="160" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="130" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#312e81">class Usuario</text>
  <line x1="50" y1="132" x2="210" y2="132" stroke="#4f46e5" stroke-width="1"/>
  <text x="50" y="158" font-size="13" fill="#3730a3">def __init__(self,</text>
  <text x="60" y="176" font-size="13" fill="#3730a3">  nombre_de_usuario,</text>
  <text x="60" y="194" font-size="13" fill="#3730a3">  contraseña):</text>
  <text x="50" y="216" font-size="13" fill="#3730a3">self.nombre_de_usuario =</text>
  <text x="60" y="232" font-size="13" fill="#3730a3">  nombre_de_usuario</text>

  <text x="130" y="270" text-anchor="middle" font-size="13" fill="#4b5563" font-style="italic">el "plano" / la plantilla</text>

  <!-- Flecha -->
  <line x1="245" y1="170" x2="330" y2="170" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="288" y="155" text-anchor="middle" font-size="12" fill="#6b7280">crea</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Objetos -->
  <rect x="350" y="30" width="190" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="445" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">usuario1</text>
  <text x="365" y="78" font-size="12" fill="#065f46">nombre_de_usuario =</text>
  <text x="375" y="94" font-size="12" fill="#065f46">"Cecilia_Ramos"</text>
  <text x="365" y="110" font-size="12" fill="#065f46">contraseña = "55123MC"</text>

  <rect x="350" y="140" width="190" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="445" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">usuario2</text>
  <text x="365" y="188" font-size="12" fill="#92400e">nombre_de_usuario =</text>
  <text x="375" y="204" font-size="12" fill="#92400e">"javier_dev"</text>
  <text x="365" y="220" font-size="12" fill="#92400e">contraseña = "abc123"</text>

  <rect x="350" y="250" width="190" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="445" y="285" text-anchor="middle" font-size="13" fill="#6b7280">...más objetos posibles</text>

  <text x="640" y="170" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic">cada objeto tiene</text>
  <text x="640" y="188" font-size="13" fill="#4b5563" text-anchor="middle" font-style="italic">sus propios valores</text>
</svg>
